services:
  api:
    build: ./backend
    platform: linux/amd64
    image: us-central1-docker.pkg.dev/meridian-healthcare-cost/my-docker-repo/healthcare-api:v1
    volumes:
      - dbdata:/data

  web:
    build: ./frontend
    platform: linux/amd64
    image: us-central1-docker.pkg.dev/meridian-healthcare-cost/my-docker-repo/healthcare-web:v1
    ports:
      - "5500:80"
    depends_on:
      - api

volumes:
  dbdata:
